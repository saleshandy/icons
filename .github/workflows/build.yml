name: Create Build

on:
  pull_request:
    branches:
      - main
      - release-v*

jobs:
  check:
    name: Create build 🔧
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo ✔️
        uses: actions/checkout@v3

      - name: Use Node ⚡
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps ⏬
        run: npm ci

      - name: Create Build 🔧
        run: npm run build
